[options]
; Les identifiants PostgreSQL viennent des variables HOST/USER/PASSWORD du conteneur.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Derrière Nginx : lit X-Forwarded-* pour construire les URL en HTTPS.
proxy_mode = True

; Verrouille le gestionnaire de bases (/web/database/*) et force la base unique.
; Ajuster db_name / dbfilter au nom réel de la base créée à la première installation.
list_db = False
db_name = eduloc
dbfilter = ^eduloc$

; Master password : à remplacer par un hash (passlib pbkdf2) ou une valeur robuste.
; Odoo le re-hache au premier changement via l'interface. Jamais de valeur par défaut en production.
admin_passwd = change-me-master-password

; Workers (VPS 4 vCPU / 8 Go : 2 workers ; 0 = mode threadé pour le dev)
workers = 2
max_cron_threads = 1
limit_memory_soft = 1342177280
limit_memory_hard = 1610612736
limit_time_cpu = 120
limit_time_real = 240

log_level = info
