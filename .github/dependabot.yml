version: 2
updates:
  - package-ecosystem: npm
    directory: "/edUloc back/eduloc-backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
  - package-ecosystem: docker
    directory: "/edUloc back/eduloc-backend"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
