name: Backend CI

on:
  pull_request:
    paths:
      - "edUloc back/eduloc-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "edUloc back/eduloc-backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: edUloc back/eduloc-backend

env:
  NODE_VERSION: "22"
  # Valeurs jetables pour la CI uniquement.
  DATABASE_URL: postgresql://eduloc:eduloc@localhost:5434/eduloc_test?schema=public
  TEST_DATABASE_URL: postgresql://eduloc:eduloc@localhost:5434/eduloc_test?schema=public

jobs:
  build-and-unit:
    name: Lint, build, tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: edUloc back/eduloc-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Tests d'intégration (PostgreSQL + PostGIS + pgvector)
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: edUloc back/eduloc-backend/package-lock.json
      - name: Base de test (image du projet)
        run: |
          docker build -t eduloc-db ./docker/db
          docker run -d --name db-test \
            -e POSTGRES_USER=eduloc -e POSTGRES_PASSWORD=eduloc -e POSTGRES_DB=eduloc_test \
            -p 5434:5432 --tmpfs /var/lib/postgresql/data eduloc-db
          for i in $(seq 1 30); do
            docker exec db-test pg_isready -U eduloc -d eduloc_test && exit 0
            sleep 2
          done
          docker logs db-test
          exit 1
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations (rejouées depuis zéro)
        run: npx prisma migrate deploy
      - run: npm run test:int

  migrations-check:
    name: Cohérence schéma / migrations
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: edUloc back/eduloc-backend/package-lock.json
      - name: Base vide
        run: |
          docker build -t eduloc-db ./docker/db
          docker run -d --name db-test \
            -e POSTGRES_USER=eduloc -e POSTGRES_PASSWORD=eduloc -e POSTGRES_DB=eduloc_test \
            -p 5434:5432 eduloc-db
          for i in $(seq 1 30); do docker exec db-test pg_isready -U eduloc -d eduloc_test && exit 0; sleep 2; done
          exit 1
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Le schéma correspond aux migrations
        run: npx prisma migrate status

  docker-build:
    name: Construction de l'image (sans publication)
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: "edUloc back/eduloc-backend"
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
